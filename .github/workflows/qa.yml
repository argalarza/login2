name: SonarQube Scan - login2

on:
  push:
    branches:
      - test
    paths:
      - 'services/login2/**'
      - '.github/workflows/build-sonar.yml'

jobs:
  sonarqube:
    name: Análisis de SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        working-directory: services/login2
        run: npm install

      - name: Ejecutar análisis SonarQube
        working-directory: services/login2
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=login2 \
            -Dsonar.projectName=login2 \
            -Dsonar.sources=. \
            -Dsonar.exclusions=**/node_modules/**,**/*.test.js,**/*.spec.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
