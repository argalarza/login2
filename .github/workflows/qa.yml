name: SonarQube Scan - login2

on:
  push:
    branches:
      - test
    paths:
      - 'services/login2/**'
      - '.github/workflows/build-sonar.yml'

jobs:
  sonarqube:
    name: 🔍 Análisis de calidad con SonarQube
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/login2

    steps:
      - name: 🧾 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧪 Ejecutar pruebas y generar cobertura (opcional)
        run: |
          if [ -f "package.json" ] && grep -q "\"test\":" package.json; then
            npm run test -- --coverage || true
          fi

      - name: 📊 Ejecutar análisis SonarQube
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=login2 \
            -Dsonar.projectName=login2 \
            -Dsonar.sources=. \
            -Dsonar.exclusions=**/node_modules/**,**/*.test.js,**/*.spec.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
